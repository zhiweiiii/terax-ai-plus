[package]
name = "terax"
version = "0.9.0"
description = "Terax — an open-source AI-native terminal emulator"
authors = ["crynta"]
license = "Apache-2.0"
edition = "2021"
default-run = "terax-prod"

[workspace]
members = ["crates/terax-cli", "crates/terax-control-protocol"]
default-members = [".", "crates/terax-cli", "crates/terax-control-protocol"]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "terax-prod"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
terax-control-protocol = { path = "crates/terax-control-protocol" }
portable-pty = "0.9"
dirs = "6"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", default-features = false, features = [
	"rt",
	"rt-multi-thread",
	"net",
	"time",
] }
# The Claude gateway's upstream half. All three are already linked through
# tauri-plugin-updater, so declaring them costs no extra binary weight.
reqwest = { version = "0.13", default-features = false, features = [
	"json",
	"stream",
] }
futures-util = "0.3"
# reqwest is built without a bundled crypto provider and panics when none is
# installed. Never enable rustls' default features here: they would pull in
# aws-lc-rs alongside the ring build that is already compiled in.
rustls = { version = "0.23", default-features = false, features = [
	"ring",
	"std",
] }
base64 = "0.22"
sha1 = "0.10"
tempfile = "3"
notify = "8.2.0"
which = "8.0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = "0.5.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_Console",
	"Win32_System_DataExchange",
	"Win32_System_JobObjects",
	"Win32_System_Memory",
	"Win32_System_Ole",
	"Win32_System_ProcessStatus",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_UI_Shell",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true
split-debuginfo = "unpacked"
codegen-units = 16
opt-level = 0
# Full debuginfo on everything is what made target/debug 37 GB, most of it in
# `deps`. Line tables keep a backtrace useful - file and line on every frame -
# at a fraction of the size. `incremental` stays on above: it is what makes an
# edit-rebuild cycle fast, and it is a cache that can be deleted when it grows.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Nobody steps through a dependency here, and they are the bulk of the bytes.
debug = false

[profile.dev.build-override]
opt-level = 0

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
