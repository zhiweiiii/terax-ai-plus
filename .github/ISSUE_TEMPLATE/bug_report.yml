name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the fields below to help triage.

        For **security issues**, do NOT open an issue. See [SECURITY.md](https://github.com/zhiweiiii/terax-ai-plus/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Terax version
      description: From Settings → About, or the bottom-right status bar.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Mobile browser connected to Terax on Windows
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Windows 11; for mobile, also include phone OS and browser version"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered list of exact steps. The more specific, the faster we can help.
      placeholder: |
        1. Open Terax
        2. Click ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        If applicable, paste relevant logs (devtools console, terminal output) or attach screenshots.
        Do not include passwords, cookies, API keys, or private conversation content.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I am running the latest version (or this happens on `main`)
          required: false
