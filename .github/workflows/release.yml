name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Configure release channel
        id: channel
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.TERAX_UPDATER_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $signed = -not [string]::IsNullOrWhiteSpace($env:SIGNING_KEY)
          $hasPublic = -not [string]::IsNullOrWhiteSpace($env:PUBLIC_KEY)
          if ($signed -ne $hasPublic) { throw "Configure both signing key and updater public key, or neither" }
          $config = @{ bundle = @{ createUpdaterArtifacts = $signed } }
          if ($signed) { $config.plugins = @{ updater = @{ pubkey = $env:PUBLIC_KEY } } }
          $configPath = Join-Path $env:RUNNER_TEMP "terax-release.json"
          $config | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $configPath -Encoding utf8
          "args=--config `"$configPath`"" | Out-File $env:GITHUB_OUTPUT -Append
          "signed=$($signed.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "build-v__VERSION__" }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TERAX_SIGNED_UPDATES: ${{ steps.channel.outputs.signed }}
        with:
          tauriScript: pnpm tauri
          args: ${{ steps.channel.outputs.args }}
          tagName: ${{ steps.channel.outputs.tag }}
          releaseName: "Terax __VERSION__"
          releaseBody: "Download the Windows NSIS installer from the assets."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: ${{ steps.channel.outputs.signed == 'true' }}
          uploadUpdaterSignatures: ${{ steps.channel.outputs.signed == 'true' }}
          updaterJsonPreferNsis: true
